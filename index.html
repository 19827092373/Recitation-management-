<body>
    <!-- 班级选择器 -->
    <div class="class-selector">
        <div class="class-selector-left">
            <span class="class-selector-label">📚 班级：</span>
            <select class="class-select" id="class-select">
                <!-- 班级选项将通过JavaScript动态生成 -->
            </select>
        </div>
        <div class="class-actions">
            <button class="class-action-btn" id="add-class-btn">➕ 添加班级</button>
            <button class="class-action-btn" id="rename-class-btn">✏️ 重命名</button>
            <button class="class-action-btn delete" id="delete-class-btn">🗑️ 删除</button>
        </div>
    </div>
    
    <div class="container">
        <div class="task-section">
            <h1>背诵任务</h1>
            
            <div class="task-tabs" id="task-tabs">
                <!-- 任务标签将通过JavaScript动态生成 -->
                <div class="task-tab-add" id="add-task-tab"><i class="bi bi-plus-circle-fill"></i> 新任务</div>
            </div>
            
            <textarea id="task-content" placeholder="请输入背诵任务内容..."></textarea>
            
            <!-- 任务管理区域 -->
            <div class="task-management" id="task-management">
                <h3>📋 当前任务管理</h3>
                <div class="task-actions">
                    <button class="task-action-btn task-rename-btn" id="task-rename-btn">✏️ 重命名</button>
                    <button class="task-action-btn task-copy-btn" id="task-copy-btn">📋 复制任务</button>
                    <button class="task-action-btn task-delete-btn-main" id="task-delete-main-btn">🗑️ 删除任务</button>
                </div>
                <input type="text" class="task-rename-input hidden" id="task-rename-input" placeholder="输入新任务名称...">
            </div>
            
            <div class="import-section hidden" id="import-section">
                <h2>导入学生名单</h2>
                <p>请输入学生名单，每行一个姓名：</p>
                <textarea id="import-students" placeholder="张三&#10;李四&#10;王五" style="height: 100px;"></textarea>
                <button class="import-btn" id="confirm-import">确认导入</button>
            </div>
            
            <div class="button-group">
                <button class="export-img-btn" id="export-image">📷 导出图片</button>
                <button class="export-excel-btn" id="export-excel">📊 导出Excel</button>
                <button class="reset-btn" id="reset-data">🔄 重置数据</button>
                <button class="import-btn" id="import-students-btn">👥 导入名单</button>
            </div>
        </div>
        
        <div class="students-section">
            <h1>学生名单</h1>
            
            <!-- 统计信息卡片 -->
            <div class="stats-container" id="stats-container">
                <div class="stat-card">
                    <div class="stat-label">总人数</div>
                    <div class="stat-value" id="stat-total">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">已完成</div>
                    <div class="stat-value" id="stat-completed">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">未完成</div>
                    <div class="stat-value" id="stat-pending">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">完成率</div>
                    <div class="stat-value" id="stat-rate">0%</div>
                </div>
            </div>
            
            <!-- 进度条 -->
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar" style="width: 0%">0%</div>
            </div>
            
            <!-- 搜索框 -->
            <div class="search-container">
                <input type="text" class="search-input" id="search-input" placeholder="搜索学生姓名...">
                <span class="search-icon">🔍</span>
            </div>
            
            <!-- 批量操作工具栏 -->
            <div class="batch-toolbar" id="batch-toolbar">
                <button class="batch-select-btn" id="select-all-btn">全选</button>
                <button class="batch-select-btn" id="select-none-btn">取消全选</button>
                <button class="batch-select-btn" id="select-inverse-btn">反选</button>
                <button class="batch-mark-btn" id="batch-mark-btn">批量标记完成</button>
                <button class="batch-unmark-btn" id="batch-unmark-btn">批量取消完成</button>
            </div>
            
            <div class="student-list" id="student-list">
                <!-- 学生卡片将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>
    
    <!-- 导出图片预览 -->
    <div id="export-preview">
        <span class="close-preview" id="close-preview">&times;</span>
        <div id="export-preview-content">
            <!-- 预览内容将通过JavaScript动态生成 -->
        </div>
        
        <div class="loading-indicator" id="loading-indicator">
            <div class="spinner"></div>
            <p>正在生成图片，请稍候...</p>
        </div>
        
        <div id="image-container">
            <img id="preview-image" alt="预览图片">
        </div>
        
        <div id="export-preview-buttons">
            <button class="export-img-btn" id="download-image">下载图片</button>
            <button class="reset-btn" id="cancel-export">取消</button>
        </div>
    </div>
    
    <div class="status-bar" id="status-bar">数据已保存到浏览器缓存</div>
    
    <!-- 班级管理模态框 -->
    <div class="class-modal" id="class-modal">
        <div class="class-modal-content">
            <h3 id="class-modal-title">添加班级</h3>
            <input type="text" class="class-modal-input" id="class-modal-input" placeholder="请输入班级名称，如：一年级1班">
            <div class="class-modal-buttons">
                <button class="class-modal-btn secondary" id="class-modal-cancel">取消</button>
                <button class="class-modal-btn primary" id="class-modal-confirm">确认</button>
            </div>
        </div>
    </div>

    <script>
        // 应用状态 - 支持多班级
        let appState = {
            classes: [
                {
                    id: 1,
                    name: "默认班级",
                    students: [],
                    tasks: [
                        {
                            id: 1,
                            content: "默认任务：背诵Unit 1课文",
                            students: []
                        }
                    ]
                }
            ],
            currentClassId: 1,
            currentTaskId: 1,
            lastSaved: new Date().toLocaleString()
        };
        
        // 初始学生数据
        const initialStudents = [
            "张三", "李四", "王五", "赵六", "钱七", "孙八", "周九", "吴十",
            "郑十一", "王十二", "李十三", "赵十四", "钱十五", "孙十六", "周十七", "吴十八"
        ];
        
        // 自动保存计时器
        let autoSaveTimer = null;
        
        // 当前生成的图片URL
        let currentImageUrl = null;
        
        // 当前选择的布局
        let currentLayout = 'single';
        
        // 搜索关键词
        let searchKeyword = '';
        
        // 选中的学生索引
        let selectedStudents = new Set();
        
        // 初始化应用
        function initApp() {
            // 从localStorage加载数据
            loadData();
            
            // 数据迁移：如果旧数据格式，转换为新格式
            migrateOldData();
            
            // 初始化当前班级的第一个任务的学生数据（如果为空）
            const currentClass = getCurrentClass();
            if (currentClass) {
                // 确保有tasks数组
                if (!currentClass.tasks || !Array.isArray(currentClass.tasks)) {
                    currentClass.tasks = [];
                }
                
                // 如果没有任务，创建一个默认任务
                if (currentClass.tasks.length === 0) {
                    currentClass.tasks.push({
                        id: 1,
                        content: "默认任务：背诵Unit 1课文",
                        students: []
                    });
                    appState.currentTaskId = 1;
                }
                
                // 确保有students数组
                if (!currentClass.students || !Array.isArray(currentClass.students)) {
                    currentClass.students = [];
                }
                
                const firstTask = currentClass.tasks[0];
                if (firstTask) {
                    // 确保任务有students数组
                    if (!firstTask.students || !Array.isArray(firstTask.students)) {
                        firstTask.students = [];
                    }
                    
                    if (firstTask.students.length === 0 && currentClass.students.length > 0) {
                        // 如果任务没有学生，使用班级的学生名单
                        firstTask.students = currentClass.students.map(name => ({
                            name: typeof name === 'string' ? name : (name.name || ''),
                            completed: false
                        }));
                    } else if (firstTask.students.length === 0 && currentClass.students.length === 0) {
                        // 如果班级也没有学生，使用默认学生
                        firstTask.students = initialStudents.map(name => ({
                            name: name,
                            completed: false
                        }));
                        currentClass.students = initialStudents.slice(); // 复制数组
                    }
                }
            }
            
            // 渲染班级选择器
            renderClassSelector();
            
            // 渲染任务标签
            renderTaskTabs();
            
            // 渲染当前任务和学生列表
            renderCurrentTask();
            
            // 清空选择
            selectedStudents.clear();
            
            // 设置事件监听器
            setupEventListeners();
            
            // 确保导入区域默认隐藏
            const importSection = document.getElementById('import-section');
            if (importSection) {
                importSection.classList.add('hidden');
            }
            
            // 设置自动保存
            setupAutoSave();
            
            // 更新状态栏
            updateStatusBar();
        }
        
        // 数据迁移：将旧数据格式转换为新格式
        function migrateOldData() {
            // 如果已经有classes字段，说明已经是新格式
            if (appState.classes && Array.isArray(appState.classes) && appState.classes.length > 0) {
                // 确保每个班级都有必要的字段
                appState.classes.forEach(cls => {
                    if (!cls.students) cls.students = [];
                    if (!cls.tasks || !Array.isArray(cls.tasks)) cls.tasks = [];
                    cls.tasks.forEach(task => {
                        if (!task.students) task.students = [];
                    });
                });
                return;
            }
            
            // 旧格式：appState.tasks
            if (appState.tasks && Array.isArray(appState.tasks) && appState.tasks.length > 0) {
                // 获取第一个任务的学生名单作为班级学生名单
                const firstTask = appState.tasks[0];
                let classStudents = [];
                if (firstTask.students && Array.isArray(firstTask.students)) {
                    classStudents = firstTask.students.map(s => {
                        if (typeof s === 'string') return s;
                        return s.name || '';
                    }).filter(name => name);
                }
                
                // 转换为新格式
                appState.classes = [{
                    id: 1,
                    name: "默认班级",
                    students: classStudents,
                    tasks: appState.tasks.map(task => ({
                        id: task.id || 1,
                        content: task.content || "默认任务",
                        students: (task.students && Array.isArray(task.students)) ? task.students : []
                    }))
                }];
                
                appState.currentClassId = 1;
                if (appState.currentTaskId) {
                    appState.currentTaskId = appState.currentTaskId;
                } else if (appState.tasks.length > 0) {
                    appState.currentTaskId = appState.tasks[0].id || 1;
                } else {
                    appState.currentTaskId = 1;
                }
                
                // 删除旧字段
                delete appState.tasks;
                
                // 保存迁移后的数据
                saveData();
                console.log('数据已从旧格式迁移到新格式');
            } else {
                // 如果既没有classes也没有tasks，使用默认数据
                appState.classes = [{
                    id: 1,
                    name: "默认班级",
                    students: [],
                    tasks: [{
                        id: 1,
                        content: "默认任务：背诵Unit 1课文",
                        students: []
                    }]
                }];
                appState.currentClassId = 1;
                appState.currentTaskId = 1;
            }
        }
        
        // 获取当前班级
        function getCurrentClass() {
            if (!appState.classes || appState.classes.length === 0) {
                // 如果没有班级，创建一个默认班级
                appState.classes = [{
                    id: 1,
                    name: "默认班级",
                    students: [],
                    tasks: [{
                        id: 1,
                        content: "默认任务：背诵Unit 1课文",
                        students: []
                    }]
                }];
                appState.currentClassId = 1;
                appState.currentTaskId = 1;
            }
            return appState.classes.find(cls => cls.id === appState.currentClassId) || appState.classes[0];
        }
        
        // 渲染班级选择器
        function renderClassSelector() {
            const classSelect = document.getElementById('class-select');
            if (!classSelect) return;
            
            classSelect.innerHTML = '';
            
            if (appState.classes && Array.isArray(appState.classes)) {
                appState.classes.forEach(cls => {
                    if (cls && cls.id && cls.name) {
                        const option = document.createElement('option');
                        option.value = cls.id;
                        option.textContent = cls.name || '未命名班级';
                        if (cls.id === appState.currentClassId) {
                            option.selected = true;
                        }
                        classSelect.appendChild(option);
                    }
                });
            }
        }
        
        // 设置自动保存
        function setupAutoSave() {
            // 监听任务内容变化
            const taskContent = document.getElementById('task-content');
            if (taskContent) {
                taskContent.addEventListener('input', () => {
                    // 清除之前的计时器
                    if (autoSaveTimer) {
                        clearTimeout(autoSaveTimer);
                    }
                    
                    // 设置新的计时器，输入停止后1秒自动保存
                    autoSaveTimer = setTimeout(() => {
                        saveCurrentTask(false); // 静默保存，不显示提示
                    }, 1000);
                });
            }
        }
        
        // 更新状态栏
        function updateStatusBar() {
            const statusBar = document.getElementById('status-bar');
            if (statusBar) {
                statusBar.textContent = `上次保存: ${appState.lastSaved || '未保存'}`;
            }
        }
        
        // 渲染任务标签
        function renderTaskTabs() {
            const taskTabs = document.getElementById('task-tabs');
            // 清除现有标签，但保留"新任务"按钮
            const addTaskTab = document.getElementById('add-task-tab');
            taskTabs.innerHTML = '';
            taskTabs.appendChild(addTaskTab);
            
            // 获取当前班级的任务
            const currentClass = getCurrentClass();
            if (!currentClass) return;
            
            // 添加每个任务的标签
            currentClass.tasks.forEach(task => {
                const taskTab = document.createElement('div');
                taskTab.className = `task-tab ${task.id === appState.currentTaskId ? 'active' : ''}`;
                taskTab.dataset.taskId = task.id;
                
                // 截取任务内容的前10个字符作为标签名
                let tabName = task.content.substring(0, 10);
                if (task.content.length > 10) {
                    tabName += '...';
                }
                
                // 为任务标签添加图标和删除按钮
                taskTab.innerHTML = `
                    <i class="bi bi-journal-bookmark-fill"></i> ${tabName}
                    <span class="task-delete-btn" data-task-id="${task.id}" title="删除任务">×</span>
                `;
                
                // 将新标签插入到"新任务"按钮之前
                taskTabs.insertBefore(taskTab, addTaskTab);
            });
        }
        
        // 渲染当前任务和学生列表
        function renderCurrentTask() {
            // 找到当前任务
            const currentTask = getCurrentTask();
            if (!currentTask) return;
            
            // 设置任务内容
            const taskContent = document.getElementById('task-content');
            if (taskContent) {
                taskContent.value = currentTask.content || '';
            }
            
            // 渲染学生列表
            if (currentTask.students && Array.isArray(currentTask.students)) {
                renderStudentList(currentTask.students);
            } else {
                renderStudentList([]);
            }
        }
        
        // 渲染学生列表
        function renderStudentList(students) {
            const studentList = document.getElementById('student-list');
            if (!studentList) return;
            
            studentList.innerHTML = '';
            
            if (!students || !Array.isArray(students) || students.length === 0) {
                studentList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">👥</div>
                        <p>暂无学生名单，请先导入学生名单</p>
                    </div>
                `;
                return;
            }
            
            // 过滤学生（根据搜索关键词）
            const filteredStudents = students.filter((student, index) => {
                if (!searchKeyword) return true;
                return student.name.toLowerCase().includes(searchKeyword.toLowerCase());
            });
            
            if (filteredStudents.length === 0 && searchKeyword) {
                studentList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>未找到匹配的学生</p>
                    </div>
                `;
                return;
            }
            
            students.forEach((student, index) => {
                const studentCard = document.createElement('div');
                const isFiltered = searchKeyword && !student.name.toLowerCase().includes(searchKeyword.toLowerCase());
                const isSelected = selectedStudents.has(index);
                
                studentCard.className = `student-card ${student.completed ? 'completed' : ''} ${isFiltered ? 'filtered-out' : ''} ${isSelected ? 'selected' : ''}`;
                studentCard.dataset.index = index;
                
                if (isSelected) {
                    studentCard.style.border = '2px solid #1a73e8';
                    studentCard.style.boxShadow = '0 0 0 3px rgba(26,115,232,0.2)';
                }
                
                // 创建状态标签，添加动画类
                const statusText = student.completed ? '✅ 已完成' : '⏳ 未完成';
                studentCard.innerHTML = `
                    <h3>${student.name}</h3>
                    <p class="status-badge">${statusText}</p>
                `;
                
                studentList.appendChild(studentCard);
                
                // 如果是刚完成的，添加动画效果
                if (student.completed) {
                    setTimeout(() => {
                        studentCard.classList.add('completed');
                    }, 50);
                }
            });
            
            // 更新统计信息
            updateStats(students);
        }
        
        // 更新统计信息
        function updateStats(students) {
            const total = students.length;
            const completed = students.filter(s => s.completed).length;
            const pending = total - completed;
            const rate = total > 0 ? ((completed / total) * 100).toFixed(1) : 0;
            
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-completed').textContent = completed;
            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('stat-rate').textContent = rate + '%';
            
            // 更新进度条
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = rate + '%';
            progressBar.textContent = rate + '%';
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 任务标签点击事件
            document.getElementById('task-tabs').addEventListener('click', (e) => {
                const taskTab = e.target.closest('.task-tab');
                if (taskTab) {
                    // 先保存当前任务
                    saveCurrentTask(false);
                    
                    // 切换到新任务
                    appState.currentTaskId = parseInt(taskTab.dataset.taskId);
                    selectedStudents.clear();
                    searchKeyword = '';
                    document.getElementById('search-input').value = '';
                    renderTaskTabs();
                    renderCurrentTask();
                }
                
                // 添加新任务
                if (e.target.closest('#add-task-tab')) {
                    addNewTask();
                }
            });
            
            // 导出图片按钮
            document.getElementById('export-image').addEventListener('click', () => {
                showExportImagePreview();
            });
            
            // 导出Excel按钮
            document.getElementById('export-excel').addEventListener('click', () => {
                exportToExcel();
            });
            
            // 下载图片按钮
            document.getElementById('download-image').addEventListener('click', downloadImage);
            
            // 取消导出按钮
            document.getElementById('cancel-export').addEventListener('click', hideExportPreview);
            
            // 关闭预览按钮
            document.getElementById('close-preview').addEventListener('click', hideExportPreview);
            
            // 重置数据按钮
            document.getElementById('reset-data').addEventListener('click', () => {
                if (confirm('确定要重置当前任务的所有学生完成状态吗？')) {
                    resetCurrentTaskStatus();
                }
            });
            
            // 导入名单按钮
            document.getElementById('import-students-btn').addEventListener('click', () => {
                const importSection = document.getElementById('import-section');
                importSection.classList.toggle('hidden');
                
                // 如果显示了导入区域，滚动到导入区域
                if (!importSection.classList.contains('hidden')) {
                    importSection.scrollIntoView({ behavior: 'smooth' });
                }
            });
            
            // 确认导入按钮
            document.getElementById('confirm-import').addEventListener('click', importStudents);
            
            // 学生卡片点击事件
            document.getElementById('student-list').addEventListener('click', (e) => {
                const studentCard = e.target.closest('.student-card');
                if (studentCard && !studentCard.classList.contains('filtered-out')) {
                    const index = parseInt(studentCard.dataset.index);
                    
                    // 如果按住Ctrl或Cmd键，则多选
                    if (e.ctrlKey || e.metaKey) {
                        toggleStudentSelection(index);
                    } else {
                        toggleStudentCompletion(index);
                    }
                }
            });
            
            // 搜索框事件
            document.getElementById('search-input').addEventListener('input', (e) => {
                searchKeyword = e.target.value;
                const currentTask = getCurrentTask();
                if (currentTask && currentTask.students) {
                    renderStudentList(currentTask.students);
                }
            });
            
            // 批量操作按钮
            document.getElementById('select-all-btn').addEventListener('click', () => {
                selectAllStudents();
            });
            
            document.getElementById('select-none-btn').addEventListener('click', () => {
                clearSelection();
            });
            
            document.getElementById('select-inverse-btn').addEventListener('click', () => {
                invertSelection();
            });
            
            document.getElementById('batch-mark-btn').addEventListener('click', () => {
                batchMarkCompleted(true);
            });
            
            document.getElementById('batch-unmark-btn').addEventListener('click', () => {
                batchMarkCompleted(false);
            });
            
            // 任务删除按钮事件（事件委托）
            document.getElementById('task-tabs').addEventListener('click', (e) => {
                if (e.target.classList.contains('task-delete-btn')) {
                    e.stopPropagation();
                    const taskId = parseInt(e.target.dataset.taskId);
                    deleteTask(taskId);
                }
            });
            
            // 班级选择器事件
            document.getElementById('class-select').addEventListener('change', (e) => {
                switchClass(parseInt(e.target.value));
            });
            
            // 添加班级按钮
            document.getElementById('add-class-btn').addEventListener('click', () => {
                showClassModal('add');
            });
            
            // 重命名班级按钮
            document.getElementById('rename-class-btn').addEventListener('click', () => {
                showClassModal('rename');
            });
            
            // 删除班级按钮
            document.getElementById('delete-class-btn').addEventListener('click', () => {
                deleteCurrentClass();
            });
            
            // 班级模态框事件
            document.getElementById('class-modal-confirm').addEventListener('click', () => {
                confirmClassModal();
            });
            
            document.getElementById('class-modal-cancel').addEventListener('click', () => {
                hideClassModal();
            });
            
            // 点击模态框背景关闭
            document.getElementById('class-modal').addEventListener('click', (e) => {
                if (e.target.id === 'class-modal') {
                    hideClassModal();
                }
            });
            
            // 模态框输入框回车确认
            document.getElementById('class-modal-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    confirmClassModal();
                } else if (e.key === 'Escape') {
                    hideClassModal();
                }
            });
            
            // 任务管理按钮
            document.getElementById('task-rename-btn').addEventListener('click', () => {
                showTaskRenameInput();
            });
            
            document.getElementById('task-copy-btn').addEventListener('click', () => {
                copyCurrentTask();
            });
            
            document.getElementById('task-delete-main-btn').addEventListener('click', () => {
                deleteCurrentTask();
            });
            
            // 任务重命名输入框
            const renameInput = document.getElementById('task-rename-input');
            renameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    confirmTaskRename();
                } else if (e.key === 'Escape') {
                    cancelTaskRename();
                }
            });
            
            renameInput.addEventListener('blur', () => {
                // 延迟一下，让点击确认按钮的事件先触发
                setTimeout(() => {
                    if (!renameInput.classList.contains('hidden')) {
                        cancelTaskRename();
                    }
                }, 200);
            });
            
            // 确认重命名按钮（在输入框旁边添加）
            let confirmRenameBtn = document.getElementById('confirm-rename-btn');
            if (!confirmRenameBtn) {
                confirmRenameBtn = document.createElement('button');
                confirmRenameBtn.className = 'task-action-btn task-rename-btn';
                confirmRenameBtn.textContent = '✓ 确认';
                confirmRenameBtn.style.display = 'none';
                confirmRenameBtn.id = 'confirm-rename-btn';
                confirmRenameBtn.addEventListener('click', confirmTaskRename);
                const renameInput = document.getElementById('task-rename-input');
                renameInput.parentNode.insertBefore(confirmRenameBtn, renameInput.nextSibling);
            }
            
            // 页面关闭前保存数据
            window.addEventListener('beforeunload', () => {
                saveCurrentTask(false);
            });
        }
        
        // 添加新任务
        function addNewTask() {
            // 先保存当前任务
            saveCurrentTask(false);
            
            const currentClass = getCurrentClass();
            if (!currentClass) return;
            
            // 生成新任务ID（当前最大ID + 1）
            let allTaskIds = [];
            appState.classes.forEach(cls => {
                if (cls.tasks && Array.isArray(cls.tasks)) {
                    cls.tasks.forEach(task => {
                        if (task.id) allTaskIds.push(task.id);
                    });
                }
            });
            const newTaskId = allTaskIds.length > 0 ? Math.max(...allTaskIds) + 1 : 1;
            
            // 创建新任务，使用当前班级的学生名单
            const newTask = {
                id: newTaskId,
                content: `新任务 ${newTaskId}`,
                students: (currentClass.students && Array.isArray(currentClass.students)) 
                    ? currentClass.students.map(name => ({
                        name: typeof name === 'string' ? name : (name.name || ''),
                        completed: false
                    }))
                    : []
            };
            
            // 添加到当前班级的任务列表
            currentClass.tasks.push(newTask);
            
            // 切换到新任务
            appState.currentTaskId = newTaskId;
            
            // 更新UI
            renderTaskTabs();
            renderCurrentTask();
            
            // 保存数据
            saveData();
        }
        
        // 保存当前任务
        function saveCurrentTask(showAlert = true) {
            const currentTask = getCurrentTask();
            if (currentTask) {
                currentTask.content = document.getElementById('task-content').value;
                
                // 保存数据
                saveData();
                
                if (showAlert) {
                    alert('任务已保存！');
                }
            }
        }
        
        // 切换学生完成状态（带动画效果）
        function toggleStudentCompletion(index) {
            const currentTask = getCurrentTask();
            if (currentTask && currentTask.students[index]) {
                const studentCard = document.querySelector(`.student-card[data-index="${index}"]`);
                if (!studentCard || studentCard.classList.contains('filtered-out')) return;
                
                const wasCompleted = currentTask.students[index].completed;
                
                // 添加动画类
                studentCard.classList.add('completing', 'flipping');
                
                // 延迟更新状态，让动画先播放
                setTimeout(() => {
                    // 切换完成状态
                    currentTask.students[index].completed = !wasCompleted;
                    
                    // 更新UI
                    renderStudentList(currentTask.students);
                    
                    // 保存数据
                    saveData();
                    
                    // 添加完成后的闪光效果
                    if (!wasCompleted) {
                        const newCard = document.querySelector(`.student-card[data-index="${index}"]`);
                        if (newCard) {
                            newCard.classList.add('completed');
                            setTimeout(() => {
                                newCard.classList.remove('completing', 'flipping');
                            }, 600);
                        }
                    }
                }, 250);
            }
        }
        
        // 重置当前任务的所有学生状态
        function resetCurrentTaskStatus() {
            const currentTask = getCurrentTask();
            if (currentTask) {
                currentTask.students.forEach(student => {
                    student.completed = false;
                });
                
                // 更新UI
                renderStudentList(currentTask.students);
                
                // 保存数据
                saveData();
                
                alert('已重置所有学生的完成状态！');
            }
        }

                alert('请输入学生名单！');

        // 生成图片
        function generateImage() {
            // 根据当前选择的布局获取要捕获的元素
            const layoutToCapture = document.getElementById(`${currentLayout}-layout`);
            
            // 显示加载指示器
            document.getElementById('loading-indicator').style.display = 'block';
            document.getElementById('image-container').style.display = 'none';
            
            // 确保html2canvas可用
            if (typeof html2canvas !== 'function') {
                console.error('html2canvas库未加载');
                alert('图片生成功能不可用，请刷新页面重试');
                document.getElementById('loading-indicator').style.display = 'none';
                return;
            }
            
            // 使用html2canvas库将内容转换为图片
            html2canvas(layoutToCapture, {
                backgroundColor: 'white',
                scale: 2, // 提高图片质量
                logging: true,
                useCORS: true,
                allowTaint: true
            }).then(function(canvas) {
                try {
                    // 将canvas转换为图片URL
                    const imgData = canvas.toDataURL('image/png');
                    
                    // 设置预览图片
                    const previewImage = document.getElementById('preview-image');
                    previewImage.src = imgData;
                    
                    // 保存当前URL用于下载
                    currentImageUrl = imgData;
                    
                    // 隐藏加载指示器，显示图片
                    document.getElementById('loading-indicator').style.display = 'none';
                    document.getElementById('image-container').style.display = 'block';
                    
                    console.log('图片生成成功');
                } catch (error) {
                    console.error('生成图片时出错:', error);
                    alert('生成图片时出错: ' + error.message);
                    document.getElementById('loading-indicator').style.display = 'none';
                }
            }).catch(function(error) {
                console.error('html2canvas执行失败:', error);
                alert('生成图片失败: ' + error.message);
                document.getElementById('loading-indicator').style.display = 'none';
            });
        }
        
        // 隐藏导出预览
        function hideExportPreview() {
            document.getElementById('export-preview').style.display = 'none';
        }
        
        // 下载图片
        function downloadImage() {
            if (!currentImageUrl) {
                alert('图片尚未生成，请稍候');
                return;
            }
            
            try {
                // 创建下载链接
                const link = document.createElement('a');
                link.href = currentImageUrl;
                
                // 获取当前任务
                const currentTask = getCurrentTask();
                const taskName = currentTask ? currentTask.content.substring(0, 10) : '背诵任务';
                
                // 设置文件名
                link.download = `${taskName}_完成情况_${new Date().toLocaleDateString()}.png`;
                
                // 触发下载
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                console.log('图片下载成功');
            } catch (error) {
                console.error('下载图片时出错:', error);
                alert('下载图片时出错: ' + error.message);
                
                // 提供备用下载方法
                alert('您可以右键点击图片，选择"图片另存为"来手动保存图片');
            }
        }
        
        // 保存数据到localStorage
        function saveData() {
            // 检查localStorage是否可用
            if (typeof(Storage) === "undefined") {
                console.warn('浏览器不支持localStorage，无法保存数据');
                return;
            }
            
            // 更新最后保存时间
            appState.lastSaved = new Date().toLocaleString();
            
            // 验证数据完整性
            if (!appState.classes || !Array.isArray(appState.classes) || appState.classes.length === 0) {
                console.error('数据格式错误，无法保存');
                return;
            }
            
            // 保存到localStorage
            try {
                const dataString = JSON.stringify(appState);
                localStorage.setItem('recitationAppState', dataString);
                console.log('数据已保存到浏览器缓存');
            } catch (e) {
                console.error('保存数据到localStorage失败:', e);
                // 如果是存储空间不足，尝试清理一些数据
                if (e.name === 'QuotaExceededError' || e.code === 22) {
                    alert('存储空间不足，请清理浏览器缓存或删除一些数据');
                } else {
                    alert('保存数据失败：' + e.message);
                }
            }
            
            // 更新状态栏
            updateStatusBar();
        }
        
        // 获取当前任务
        function getCurrentTask() {
            const currentClass = getCurrentClass();
            if (!currentClass || !currentClass.tasks || currentClass.tasks.length === 0) {
                // 如果没有任务，创建一个默认任务
                if (!currentClass.tasks) {
                    currentClass.tasks = [];
                }
                const newTask = {
                    id: 1,
                    content: "默认任务：背诵Unit 1课文",
                    students: []
                };
                currentClass.tasks.push(newTask);
                appState.currentTaskId = 1;
            }
            return currentClass.tasks.find(task => task.id === appState.currentTaskId) || currentClass.tasks[0];
        }
        
        // 切换学生选择状态
        function toggleStudentSelection(index) {
            if (selectedStudents.has(index)) {
                selectedStudents.delete(index);
            } else {
                selectedStudents.add(index);
            }
            const currentTask = getCurrentTask();
            if (currentTask && currentTask.students) {
                renderStudentList(currentTask.students);
            }
        }
        
        // 全选学生
        function selectAllStudents() {
            const currentTask = getCurrentTask();
            if (!currentTask || !currentTask.students) return;
            selectedStudents.clear();
            currentTask.students.forEach((_, index) => {
                if (!searchKeyword || currentTask.students[index].name.toLowerCase().includes(searchKeyword.toLowerCase())) {
                    selectedStudents.add(index);
                }
            });
            renderStudentList(currentTask.students);
        }
        
        // 取消全选
        function clearSelection() {
            selectedStudents.clear();
            const currentTask = getCurrentTask();
            if (currentTask && currentTask.students) {
                renderStudentList(currentTask.students);
            }
        }
        
        // 反选
        function invertSelection() {
            const currentTask = getCurrentTask();
            if (!currentTask || !currentTask.students) return;
            const visibleIndices = currentTask.students
                .map((_, index) => index)
                .filter(index => !searchKeyword || currentTask.students[index].name.toLowerCase().includes(searchKeyword.toLowerCase()));
            
            visibleIndices.forEach(index => {
                if (selectedStudents.has(index)) {
                    selectedStudents.delete(index);
                } else {
                    selectedStudents.add(index);
                }
            });
            renderStudentList(currentTask.students);
        }
        
        // 批量标记完成状态
        function batchMarkCompleted(completed) {
            if (selectedStudents.size === 0) {
                alert('请先选择要操作的学生');
                return;
            }
            
            const currentTask = getCurrentTask();
            selectedStudents.forEach(index => {
                if (currentTask.students[index]) {
                    currentTask.students[index].completed = completed;
                }
            });
            
            selectedStudents.clear();
            renderStudentList(currentTask.students);
            saveData();
        }
        
        // 删除任务
        function deleteTask(taskId) {
            const currentClass = getCurrentClass();
            if (!currentClass) return;
            
            if (currentClass.tasks.length <= 1) {
                alert('至少需要保留一个任务！');
                return;
            }
            
            if (confirm('确定要删除这个任务吗？此操作不可恢复。')) {
                currentClass.tasks = currentClass.tasks.filter(task => task.id !== taskId);
                
                // 如果删除的是当前任务，切换到第一个任务
                if (appState.currentTaskId === taskId) {
                    appState.currentTaskId = currentClass.tasks[0].id;
                }
                
                renderTaskTabs();
                renderCurrentTask();
                saveData();
            }
        }
        
        // 删除当前任务

            deleteTask(appState.currentTaskId);

        // 取消任务重命名
        function cancelTaskRename() {
            const renameInput = document.getElementById('task-rename-input');
            const renameBtn = document.getElementById('task-rename-btn');
            const confirmBtn = document.getElementById('confirm-rename-btn');
            
            renameInput.classList.add('hidden');
            renameBtn.style.display = 'block';
            confirmBtn.style.display = 'none';
            renameInput.value = '';
        }
        
        // 复制当前任务
        function copyCurrentTask() {
            const currentTask = getCurrentTask();
            const currentClass = getCurrentClass();
            if (!currentTask || !currentClass) return;
            
            // 生成新任务ID
            let allTaskIds = [];
            appState.classes.forEach(cls => {
                if (cls.tasks && Array.isArray(cls.tasks)) {
                    cls.tasks.forEach(task => {
                        if (task.id) allTaskIds.push(task.id);
                    });
                }
            });
            const newTaskId = allTaskIds.length > 0 ? Math.max(...allTaskIds) + 1 : 1;
            
                // 创建新任务（复制当前任务的所有数据）
                const newTask = {
                    id: newTaskId,
                    content: (currentTask.content || '新任务') + ' (副本)',
                    students: (currentTask.students && Array.isArray(currentTask.students))
                        ? currentTask.students.map(student => ({
                            name: typeof student === 'string' ? student : (student.name || ''),
                            completed: false  // 复制时重置完成状态
                        }))
                        : []
                };
            
            // 添加到当前班级的任务列表
            currentClass.tasks.push(newTask);
            
            // 切换到新任务
            appState.currentTaskId = newTaskId;
            
            // 更新UI
            renderTaskTabs();
            renderCurrentTask();
            saveData();
            
            // 显示提示
            const statusBar = document.getElementById('status-bar');
            const originalText = statusBar.textContent;
            statusBar.textContent = '任务已复制！';
            statusBar.style.backgroundColor = '#28a745';
            setTimeout(() => {
                statusBar.textContent = originalText;
                statusBar.style.backgroundColor = '#1a73e8';
            }, 2000);
        }
        
        // 导出Excel/CSV
        function exportToExcel() {
            const currentTask = getCurrentTask();
            if (!currentTask || !currentTask.students || !Array.isArray(currentTask.students) || currentTask.students.length === 0) {
                alert('当前任务没有学生数据，无法导出！');
                return;
            }
            
            // 创建CSV内容
            let csv = '\uFEFF'; // BOM for Excel
            csv += '序号,姓名,完成状态\n';
            
            currentTask.students.forEach((student, index) => {
                csv += `${index + 1},${student.name},${student.completed ? '已完成' : '未完成'}\n`;
            });
            
            // 添加统计信息
            const completedCount = currentTask.students.filter(s => s.completed).length;
            const totalCount = currentTask.students.length;
            const completionRate = totalCount > 0 ? ((completedCount / totalCount) * 100).toFixed(2) : 0;
            csv += `\n统计信息\n`;
            csv += `总人数,${totalCount}\n`;
            csv += `已完成,${completedCount}\n`;
            csv += `完成率,${completionRate}%\n`;
            
            // 创建下载链接
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = `${currentTask.content.substring(0, 20)}_完成情况_${new Date().toLocaleDateString()}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
        
        // 从localStorage加载数据
        function loadData() {
            try {
                // 检查localStorage是否可用
                if (typeof(Storage) === "undefined") {
                    console.warn('浏览器不支持localStorage');
                    return;
                }
                
                const savedState = localStorage.getItem('recitationAppState');
                if (savedState) {
                    const parsedState = JSON.parse(savedState);
                    // 支持新旧两种数据格式
                    if (parsedState && (parsedState.classes || parsedState.tasks)) {
                        // 验证数据完整性
                        if (parsedState.classes && Array.isArray(parsedState.classes)) {
                            appState = parsedState;
                            // 确保有currentClassId
                            if (!appState.currentClassId && appState.classes.length > 0) {
                                appState.currentClassId = appState.classes[0].id;
                            }
                            // 确保有currentTaskId
                            const currentClass = appState.classes.find(c => c.id === appState.currentClassId);
                            if (!appState.currentTaskId && currentClass && currentClass.tasks && currentClass.tasks.length > 0) {
                                appState.currentTaskId = currentClass.tasks[0].id;
                            }
                            console.log('从浏览器缓存加载数据成功');
                            return;
                        } else if (parsedState.tasks && Array.isArray(parsedState.tasks)) {
                            // 旧格式，将在migrateOldData中处理
                            appState = parsedState;
                            return;
                        }
                    }
                }
            } catch (e) {
                console.error('从localStorage加载数据出错:', e);
                // 如果数据损坏，清除localStorage
                try {
                    localStorage.removeItem('recitationAppState');
                } catch (clearError) {
                    console.error('清除损坏数据失败:', clearError);
                }
            }
            
            // 如果没有保存的数据，使用默认数据
            console.log('使用默认数据');
        }
        
        // 切换班级
        function switchClass(classId) {
            // 先保存当前任务
            saveCurrentTask(false);
            
            // 切换到新班级
            appState.currentClassId = classId;
            const currentClass = getCurrentClass();
            
            // 切换到新班级的第一个任务
            if (currentClass && currentClass.tasks.length > 0) {
                appState.currentTaskId = currentClass.tasks[0].id;
            }
            
            // 清空搜索和选择
            selectedStudents.clear();
            searchKeyword = '';
            document.getElementById('search-input').value = '';
            
            // 更新UI
            renderClassSelector();
            renderTaskTabs();
            renderCurrentTask();
            
            // 保存数据
            saveData();
        }
        
        // 显示班级管理模态框
        let classModalMode = 'add'; // 'add' 或 'rename'
        function showClassModal(mode) {
            classModalMode = mode;
            const modal = document.getElementById('class-modal');
            const title = document.getElementById('class-modal-title');
            const input = document.getElementById('class-modal-input');
            
            if (mode === 'add') {
                title.textContent = '添加班级';
                input.value = '';
                input.placeholder = '请输入班级名称，如：一年级1班';
            } else if (mode === 'rename') {
                const currentClass = getCurrentClass();
                if (!currentClass) {
                    alert('请先选择一个班级');
                    return;
                }
                title.textContent = '重命名班级';
                input.value = currentClass.name;
                input.placeholder = '请输入新的班级名称';
            }
            
            modal.style.display = 'flex';
            input.focus();
            input.select();
        }
        
        // 隐藏班级管理模态框
        function hideClassModal() {
            document.getElementById('class-modal').style.display = 'none';
        }
        
        // 确认班级管理操作
        function confirmClassModal() {
            const input = document.getElementById('class-modal-input');
            const className = input.value.trim();
            
            if (!className) {
                alert('请输入班级名称！');
                return;
            }
            
            if (classModalMode === 'add') {
                addClass(className);
            } else if (classModalMode === 'rename') {
                renameCurrentClass(className);
            }
            
            hideClassModal();
        }
        
        // 添加班级
        function addClass(className) {
            // 生成新班级ID
            const newClassId = appState.classes.length > 0 
                ? Math.max(...appState.classes.map(cls => cls.id)) + 1 
                : 1;
            
            // 创建新班级
            const newClass = {
                id: newClassId,
                name: className,
                students: [],
                tasks: [
                    {
                        id: 1,
                        content: "默认任务：背诵Unit 1课文",
                        students: []
                    }
                ]
            };
            
            // 添加到班级列表
            appState.classes.push(newClass);
            
            // 切换到新班级
            switchClass(newClassId);
            
            // 显示提示
            const statusBar = document.getElementById('status-bar');
            const originalText = statusBar.textContent;
            statusBar.textContent = `班级"${className}"已创建！`;
            statusBar.style.backgroundColor = '#28a745';
            setTimeout(() => {
                statusBar.textContent = originalText;
                statusBar.style.backgroundColor = '#1a73e8';
            }, 2000);
        }
        
        // 重命名当前班级
        function renameCurrentClass(newName) {
            const currentClass = getCurrentClass();
            if (!currentClass) return;
            
            currentClass.name = newName;
            
            // 更新UI
            renderClassSelector();
            saveData();
            
            // 显示提示
            const statusBar = document.getElementById('status-bar');
            const originalText = statusBar.textContent;
            statusBar.textContent = `班级已重命名为"${newName}"！`;
            statusBar.style.backgroundColor = '#17a2b8';
            setTimeout(() => {
                statusBar.textContent = originalText;
                statusBar.style.backgroundColor = '#1a73e8';
            }, 2000);
        }
        
        // 删除当前班级
        function deleteCurrentClass() {
            if (appState.classes.length <= 1) {
                alert('至少需要保留一个班级！');
                return;
            }
            
            const currentClass = getCurrentClass();
            if (!currentClass) return;
            
            if (confirm(`确定要删除班级"${currentClass.name}"吗？此操作将删除该班级的所有任务和学生数据，且不可恢复。`)) {
                // 删除班级
                appState.classes = appState.classes.filter(cls => cls.id !== appState.currentClassId);
                
                // 切换到第一个班级
                appState.currentClassId = appState.classes[0].id;
                const newClass = getCurrentClass();
                if (newClass && newClass.tasks.length > 0) {
                    appState.currentTaskId = newClass.tasks[0].id;
                }
                
                // 清空搜索和选择
                selectedStudents.clear();
                searchKeyword = '';
                document.getElementById('search-input').value = '';
                
                // 更新UI
                renderClassSelector();
                renderTaskTabs();
                renderCurrentTask();
                saveData();
            }
        }
        
        // 初始化应用
        window.onload = function() {
            try {
                // 初始化应用
                initApp();
                
                // 检查html2canvas是否已加载
                if (typeof html2canvas !== 'function') {
                    console.log('html2canvas未加载，尝试加载...');
                    loadHtml2Canvas();
                } else {
                    console.log('html2canvas已加载');
                }
            } catch (error) {
                console.error('应用初始化失败:', error);
                alert('应用初始化失败，请刷新页面重试。如果问题持续，请清除浏览器缓存。');
            }
        };
        
        // 加载html2canvas库
        function loadHtml2Canvas() {
            // 检查是否已经有script标签
            const existingScript = document.querySelector('script[src*="html2canvas"]');
            if (existingScript) {
                console.log('html2canvas脚本标签已存在，不重复加载');
                return;
            }
            
            console.log('开始加载html2canvas库...');
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
            script.async = true;
            script.onload = function() {
                console.log('html2canvas库加载成功');
            };
            script.onerror = function(e) {
                console.error('html2canvas库加载失败:', e);
                alert('加载图片导出功能失败，请检查网络连接后刷新页面重试。');
                
                // 尝试使用备用CDN
                const backupScript = document.createElement('script');
                backupScript.src = 'https://html2canvas.hertzen.com/dist/html2canvas.min.js';
                backupScript.async = true;
                backupScript.onload = function() {
                    console.log('html2canvas库从备用CDN加载成功');
                };
                backupScript.onerror = function() {
                    console.error('html2canvas库从备用CDN加载也失败');
                };
                document.head.appendChild(backupScript);
            };
            document.head.appendChild(script);
        }
    </script>

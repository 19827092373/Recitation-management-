name: Deploy Commenter to Aliyun ECS

on:
  push:
    branches:
      - main
    paths:
      - 'commenter/**'  # 只监听 commenter 目录的变化

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'commenter/package-lock.json'

      - name: Install Dependencies
        working-directory: ./commenter
        run: npm ci

      - name: Build Project
        working-directory: ./commenter
        run: npm run build

      - name: Verify Build Output
        working-directory: ./commenter
        run: |
          if [ ! -d "out" ]; then
            echo "Error: Build output directory 'out' not found!"
            exit 1
          fi
          echo "Build output verified:"
          ls -la out/ | head -20

      - name: Deploy to ECS Subdirectory
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "commenter/out/*"
          target: "/www/wwwroot/recitation.teacherlab.cn/commenter"
          strip_components: 2
          rm: false
          overwrite: true
          timeout: 300s

      - name: Verify Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Checking deployed files..."
            ls -la /www/wwwroot/recitation.teacherlab.cn/commenter/ | head -20
            echo "Deployment completed successfully!"
            echo "Access URL: https://recitation.teacherlab.cn/commenter"
